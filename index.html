<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <link rel="icon" href="favicon.ico">
  <title>Documentación de Re-Inventa</title>
  <meta name="description" content="Acceso a la documentación funcional pública de ReAuditIA y Reagentia.">
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f7f7f8; color: #182033; }
    main { max-width: 54rem; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { margin-bottom: .5rem; font-size: clamp(2rem, 5vw, 3rem); }
    .intro { max-width: 42rem; color: #4b5565; font-size: 1.1rem; }
    .guides { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; margin-top: 2rem; }
    a { display: block; padding: 1.5rem; border: 1px solid #d9dce3; border-radius: .8rem; background: white; color: inherit; text-decoration: none; box-shadow: 0 .2rem .8rem rgb(24 32 51 / 6%); }
    a:hover, a:focus-visible { border-color: #d45113; outline: .18rem solid rgb(212 81 19 / 22%); }
    strong { display: block; margin-bottom: .4rem; color: #c7470b; font-size: 1.25rem; }
    span { color: #4b5565; }
  </style>
</head>
<body>
  <main>
    <h1>Documentación de Re-Inventa</h1>
    <p class="intro">Selecciona el producto cuya guía funcional quieres consultar.</p>
    <div class="guides">
      <a href="reauditia/"><strong>ReAuditIA</strong><span>Auditoría y análisis de grabaciones y documentos.</span></a>
      <a href="reagentia/"><strong>Reagentia</strong><span>Configuración y ejecución de soluciones basadas en agentes.</span></a>
    </div>
  </main>
</body>
</html>
