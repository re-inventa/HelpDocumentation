name: Validate and publish documentation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  repository_dispatch:
    types: [reagentia-documentation-updated]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: help-documentation-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout proposed documentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test change detection
        run: python -m unittest discover -s scripts/tests -v

      - name: Detect affected documentation
        id: changes
        run: >-
          python scripts/detect_documentation_changes.py
          --base "origin/${GITHUB_BASE_REF}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Install Sphinx dependencies
        if: steps.changes.outputs.root_changed == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build existing Sphinx documentation
        if: steps.changes.outputs.root_changed == 'true'
        run: python -m sphinx -W --keep-going -b html source build/html

      - name: Install Material for MkDocs dependencies
        if: steps.changes.outputs.functional_changed == 'true'
        run: python -m pip install --disable-pip-version-check -r reagentia/requirements-docs.txt

      - name: Build and validate Reagentia functional documentation
        if: steps.changes.outputs.functional_changed == 'true'
        run: python scripts/build_reagentia.py --external-links

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Validate publication request
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          DOCUMENTATION_SHA: ${{ github.event.client_payload.documentation_sha }}
        shell: bash
        run: |
          set -euo pipefail
          case "${SOURCE_REPOSITORY}" in
            re-inventa/re-agentia|re-inventa/infra-reagentia) ;;
            *) echo 'Repositorio de origen no permitido' >&2; exit 1 ;;
          esac
          [[ "${SOURCE_REF}" == 'refs/heads/main' ]] || { echo 'Solo se acepta main' >&2; exit 1; }
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'SHA de origen no válido' >&2; exit 1; }
          [[ "${DOCUMENTATION_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'SHA documental no válido' >&2; exit 1; }

      - name: Checkout HelpDocumentation main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm requested documentation is on main
        if: github.event_name == 'repository_dispatch'
        env:
          DOCUMENTATION_SHA: ${{ github.event.client_payload.documentation_sha }}
        shell: bash
        run: git merge-base --is-ancestor "${DOCUMENTATION_SHA}" HEAD

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Test change detection
        run: python -m unittest discover -s scripts/tests -v

      - name: Detect affected documentation
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'repository_dispatch' ]]; then
            python scripts/detect_documentation_changes.py --functional --github-output "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            python scripts/detect_documentation_changes.py --all --github-output "${GITHUB_OUTPUT}"
          else
            base="${BEFORE_SHA}"
            if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}"; then
              base="HEAD^"
            fi
            python scripts/detect_documentation_changes.py \
              --base "${base}" \
              --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Install Sphinx dependencies
        if: steps.changes.outputs.root_changed == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Build existing Sphinx documentation
        if: steps.changes.outputs.root_changed == 'true'
        run: python -m sphinx -W --keep-going -b html source build/html

      - name: Install Material for MkDocs dependencies
        if: steps.changes.outputs.functional_changed == 'true'
        run: python -m pip install --disable-pip-version-check -r reagentia/requirements-docs.txt

      - name: Build and validate Reagentia functional documentation
        if: steps.changes.outputs.functional_changed == 'true'
        run: python scripts/build_reagentia.py --external-links

      - name: Checkout publication branch
        if: steps.changes.outputs.root_changed == 'true' || steps.changes.outputs.functional_changed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: .publish

      - name: Publish changed documentation to gh-pages
        if: steps.changes.outputs.root_changed == 'true' || steps.changes.outputs.functional_changed == 'true'
        env:
          ROOT_CHANGED: ${{ steps.changes.outputs.root_changed }}
          FUNCTIONAL_CHANGED: ${{ steps.changes.outputs.functional_changed }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${ROOT_CHANGED}" == 'true' ]]; then
            rsync -a --delete --exclude='.git/' --exclude='reagentia/' build/html/ .publish/
          fi
          if [[ "${FUNCTIONAL_CHANGED}" == 'true' ]]; then
            mkdir -p .publish/reagentia
            rsync -a --delete build/reagentia/ .publish/reagentia/
          fi
          touch .publish/.nojekyll
          cd .publish
          git config user.email 'action@github.com'
          git config user.name 'GitHub Action'
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay cambios que publicar'
            exit 0
          fi
          git commit -m "deploy ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
