name: Validate and publish documentation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  repository_dispatch:
    types: [reauditia-documentation-updated, reagentia-documentation-updated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: help-documentation-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout proposed documentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate source PR declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python scripts/validate_source_pr.py

      - name: Test change detection
        run: python -m unittest discover -s scripts/tests -v

      - name: Detect affected documentation
        id: changes
        run: >-
          python scripts/detect_documentation_changes.py
          --base "origin/${GITHUB_BASE_REF}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Install ReAuditIA documentation dependencies
        if: steps.changes.outputs.reauditia_changed == 'true'
        run: >-
          python -m pip install --disable-pip-version-check
          -r reauditia/requirements-docs.txt
          -r reauditia/requirements-responsive.txt

      - name: Install Reagentia documentation dependencies
        if: steps.changes.outputs.reagentia_changed == 'true' && steps.changes.outputs.reauditia_changed != 'true'
        run: python -m pip install --disable-pip-version-check -r reagentia/requirements-docs.txt

      - name: Build and validate ReAuditIA functional documentation
        if: steps.changes.outputs.reauditia_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_reauditia.py --external-links --responsive

      - name: Build and validate Reagentia functional documentation
        if: steps.changes.outputs.reagentia_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_reagentia.py --external-links

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: help-documentation-publish
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout HelpDocumentation main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate publication request
        if: github.event_name == 'repository_dispatch'
        env:
          EVENT_TYPE: ${{ github.event.action }}
          SOURCE_REPOSITORY: ${{ github.event.client_payload.source_repository }}
          SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
          DOCUMENTATION_SHA: ${{ github.event.client_payload.documentation_sha }}
        run: python scripts/validate_publication_request.py

      - name: Confirm requested documentation is on main
        if: github.event_name == 'repository_dispatch'
        env:
          DOCUMENTATION_SHA: ${{ github.event.client_payload.documentation_sha }}
        shell: bash
        run: git merge-base --is-ancestor "${DOCUMENTATION_SHA}" HEAD

      - name: Record exact documentation revision
        id: documentation
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Test change detection
        run: python -m unittest discover -s scripts/tests -v

      - name: Detect affected documentation
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TYPE: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == 'repository_dispatch' && "${EVENT_TYPE}" == 'reauditia-documentation-updated' ]]; then
            python scripts/detect_documentation_changes.py --reauditia --github-output "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == 'repository_dispatch' && "${EVENT_TYPE}" == 'reagentia-documentation-updated' ]]; then
            python scripts/detect_documentation_changes.py --reagentia --github-output "${GITHUB_OUTPUT}"
          elif [[ "${EVENT_NAME}" == 'workflow_dispatch' ]]; then
            python scripts/detect_documentation_changes.py --all --github-output "${GITHUB_OUTPUT}"
          else
            base="${BEFORE_SHA}"
            if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}"; then
              base="HEAD^"
            fi
            python scripts/detect_documentation_changes.py \
              --base "${base}" \
              --github-output "${GITHUB_OUTPUT}"
          fi

      - name: Install ReAuditIA documentation dependencies
        if: steps.changes.outputs.reauditia_changed == 'true'
        run: python -m pip install --disable-pip-version-check -r reauditia/requirements-docs.txt

      - name: Install Reagentia documentation dependencies
        if: steps.changes.outputs.reagentia_changed == 'true' && steps.changes.outputs.reauditia_changed != 'true'
        run: python -m pip install --disable-pip-version-check -r reagentia/requirements-docs.txt

      - name: Build and validate ReAuditIA functional documentation
        if: steps.changes.outputs.reauditia_changed == 'true'
        run: python scripts/build_reauditia.py

      - name: Build and validate Reagentia functional documentation
        if: steps.changes.outputs.reagentia_changed == 'true'
        run: python scripts/build_reagentia.py

      - name: Checkout publication branch
        if: steps.changes.outputs.reauditia_changed == 'true' || steps.changes.outputs.reagentia_changed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: .publish

      - name: Publish changed documentation to gh-pages
        if: steps.changes.outputs.reauditia_changed == 'true' || steps.changes.outputs.reagentia_changed == 'true'
        env:
          REAUDITIA_CHANGED: ${{ steps.changes.outputs.reauditia_changed }}
          REAGENTIA_CHANGED: ${{ steps.changes.outputs.reagentia_changed }}
          PUBLISHED_SHA: ${{ steps.documentation.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REAUDITIA_CHANGED}" == 'true' ]]; then
            printf '%s\n' "${PUBLISHED_SHA}" > build/reauditia/publication-sha.txt
            rsync -a --delete --exclude='.git/' --exclude='reagentia/' --exclude='CNAME' build/reauditia/ .publish/
          fi
          if [[ "${REAGENTIA_CHANGED}" == 'true' ]]; then
            printf '%s\n' "${PUBLISHED_SHA}" > build/reagentia/publication-sha.txt
            mkdir -p .publish/reagentia
            rsync -a --delete build/reagentia/ .publish/reagentia/
          fi
          touch .publish/.nojekyll
          cd .publish
          git config user.email 'action@github.com'
          git config user.name 'GitHub Action'
          git add -A
          if git diff --cached --quiet; then
            echo 'No hay cambios que publicar'
            exit 0
          fi
          git commit -m "deploy ${PUBLISHED_SHA}"
          git push origin HEAD:gh-pages

      - name: Smoke test published documentation
        if: steps.changes.outputs.reauditia_changed == 'true' || steps.changes.outputs.reagentia_changed == 'true'
        env:
          REAUDITIA_CHANGED: ${{ steps.changes.outputs.reauditia_changed }}
          REAGENTIA_CHANGED: ${{ steps.changes.outputs.reagentia_changed }}
          PUBLISHED_SHA: ${{ steps.documentation.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REAUDITIA_CHANGED}" == 'true' ]]; then
            python scripts/smoke_publication.py --zone reauditia --expected-sha "${PUBLISHED_SHA}"
          fi
          if [[ "${REAGENTIA_CHANGED}" == 'true' ]]; then
            python scripts/smoke_publication.py --zone reagentia --expected-sha "${PUBLISHED_SHA}"
          fi
